name: iOS

# The iOS app's unit tests (docs/plans/ios-app.md). Only when the app or the
# API contract it decodes changes. The repository is public, so GitHub's
# macOS minutes are free; if it goes private they bill at ten times Linux.
on:
  push:
    branches: [main]
    paths: ["ios/**", "src/lib/api/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "src/lib/api/**", ".github/workflows/ios.yml"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Build and unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      # The image's simulators change with its Xcode: take the first iPhone it has.
      - name: Pick a simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"
      - name: Unit tests
        working-directory: ios
        run: |
          xcodebuild test -project HackaMatch.xcodeproj -scheme HackaMatch \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -collect-test-diagnostics never CODE_SIGNING_ALLOWED=NO
      - name: Release build
        working-directory: ios
        run: |
          xcodebuild build -project HackaMatch.xcodeproj -scheme HackaMatch -configuration Release \
            -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO
